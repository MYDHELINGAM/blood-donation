<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Skill Tracking System - Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: url('P2.jpeg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      perspective: 1000px;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
      width: 350px;
      text-align: center;
      transform: perspective(1000px) rotateY(0deg);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: perspective(1000px) rotateY(5deg) translateY(-5px);
      box-shadow: 0px 0px 30px rgba(255, 136, 0, 0.5);
    }

    h2 {
      color: #ffffff;
      margin-bottom: 15px;
      text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: black; /* Changed to black */
      transition: 0.3s;
      box-shadow: inset 0px 0px 10px rgba(255, 255, 255, 0.2);
    }

    .input-field::placeholder {
      color: black; /* Placeholder color also black */
    }

    .input-field:focus {
      border-color: #ff9800;
      box-shadow: 0px 0px 15px rgba(255, 136, 0, 0.7);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #ff9800, #e65100);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: linear-gradient(45deg, #e65100, #ff5722);
      transform: scale(1.05);
      box-shadow: 0px 0px 15px rgba(255, 136, 0, 0.8);
    }

    p {
      margin-top: 10px;
      color: white;
    }

    a {
      color: #ffcc80;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form onsubmit="event.preventDefault(); registerUser();">
      <input type="email" id="reg-email" class="input-field" placeholder="Email" required />
      <input type="password" id="reg-password" class="input-field" placeholder="Password" required />
      <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    function registerUser() {
      let email = document.getElementById("reg-email").value;
      let password = document.getElementById("reg-password").value;

      let users = JSON.parse(localStorage.getItem("users")) || {};

      if (users[email]) {
        alert("User already exists. Please login.");
      } else {
        users[email] = password;
        localStorage.setItem("users", JSON.stringify(users));
        alert("Registration successful! Please login.");
        window.location.href = "login.html";
      }
    }
  </script>
</body>
</html>
