<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR Dashboard</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('p1.jpeg') no-repeat center center fixed;
            background-size: cover;
            perspective: 1000px;
        }

        .container {
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .container:hover {
            transform: perspective(1000px) rotateX(5deg) translateY(-5px);
            box-shadow: 0px 5px 30px rgba(255, 136, 0, 0.5);
        }

        h1, h2 {
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
            animation: glowText 2s infinite alternate;
        }

        @keyframes glowText {
            from {
                text-shadow: 0 0 5px rgba(255, 152, 0, 0.3);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 152, 0, 0.8);
            }
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff9800, #e65100);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s ease-in-out;
            box-shadow: 0px 5px 15px rgba(255, 136, 0, 0.3);
            cursor: pointer;
        }

        .btn:hover {
            background: linear-gradient(45deg, #e65100, #ff5722);
            transform: scale(1.1);
            box-shadow: 0px 10px 20px rgba(255, 136, 0, 0.6);
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #42a5f5;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #1565c0;
            transform: scale(1.1);
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ef5350;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #c62828;
            transform: scale(1.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        table, th, td {
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background: #42a5f5;
            color: white;
        }

        td:hover {
            background: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        tr.new-row {
            animation: fadeInRow 0.5s ease;
        }

        @keyframes fadeInRow {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
  <div class="container">
    <!-- Home Button -->
    <a href="index.html" class="home-btn">Home</a>

    <!-- Logout Button -->
    <a href="login.html" class="logout-btn">Logout</a>

    <h1>HR Dashboard</h1>
    <h2>Employee Skill Progress Report</h2>

    <table>
      <thead>
        <tr>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Skill</th>
          <th>Project ID</th>
          <th>Project</th>
          <th>Certification</th>
          <th>Training Progress (%)</th>
        </tr>
      </thead>
      <tbody id="hrTableBody"></tbody>
    </table>

    <button onclick="clearData()" class="btn">Clear Data</button>

    <script>
      function loadHRData() {
        const employees = JSON.parse(localStorage.getItem("employees")) || [];
        const tableBody = document.getElementById("hrTableBody");

        if (employees.length === 0) {
          tableBody.innerHTML = "<tr><td colspan='7'>No records found.</td></tr>";
          return;
        }

        tableBody.innerHTML = "";
        employees.forEach(emp => {
          tableBody.innerHTML += `
            <tr>
              <td>${emp.id}</td>
              <td>${emp.name}</td>
              <td>${emp.skill}</td>
              <td>${emp.projectId}</td>
              <td>${emp.project}</td>
              <td>${emp.certification}</td>
              <td>${emp.progress}%</td>
            </tr>
          `;
        });
      }

      function clearData() {
        if (confirm("Are you sure you want to clear all employee records?")) {
          localStorage.removeItem("employees");
          loadHRData();
          alert("All records cleared.");
        }
      }

      window.onload = loadHRData;
    </script>
  </div>
</body>
</html>
