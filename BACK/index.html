<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blood Donation Management System</title>
<style>
:root {
  --primary-color: #ff0000;
  --primary-dark: #cc0000;
  --text-color: #333;
  --container-bg: rgba(255, 255, 255, 0.6);
  --animation-timing: cubic-bezier(0.4, 0, 0.2, 1);
  --container-blur: 5px;
  --shadow-color: rgba(0, 0, 0, 0.1);
  --glow-color: rgba(255, 0, 0, 0.2);
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-color: #fff;
    --container-bg: rgba(0, 0, 0, 0.6);
    --shadow-color: rgba(255, 255, 255, 0.1);
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background-image: url('Wallpaper 4k.jpeg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: grid;
  place-items: center;
  font-family: system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  position: relative;
}

.container {
  background-color: var(--container-bg);
  padding: clamp(30px, 6vw, 50px); /* increased padding */
  border-radius: 15px;
  text-align: center;
  width: min(95%, 700px); /* increased width */
  min-height: 300px; /* added min height */
  animation: bounceIn 1.2s var(--animation-timing) forwards,
             containerGlow 3s infinite alternate;
  backdrop-filter: blur(var(--container-blur));
  -webkit-backdrop-filter: blur(var(--container-blur));
  box-shadow:
    0 0 20px var(--shadow-color),
    0 10px 20px -10px var(--shadow-color);
  position: relative;
}

h1 {
  color: var(--text-color);
  margin-bottom: clamp(20px, 5vw, 40px);
  animation: textPopIn 1s ease-out forwards;
  font-size: clamp(1.5rem, 3vw, 2rem);
  text-shadow: 2px 2px 4px var(--shadow-color);
  line-height: 1.4;
  letter-spacing: 0.5px;
}

.buttons-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: fadeIn 1.5s var(--animation-timing);
}

.btn {
  background-color: var(--primary-color);
  color: white;
  padding: 20px 40px;
  border: none;
  border-radius: 10px;
  font-size: clamp(1rem, 2vw, 1.125rem);
  text-decoration: none;
  width: 100%;
  max-width: 200px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  box-shadow: 0 4px 15px var(--glow-color);
  cursor: pointer;
}

.btn:hover,
.btn:focus-visible {
  background-color: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow:
    0 6px 20px var(--glow-color),
    0 0 0 2px var(--primary-color);
}

.btn:active {
  transform: scale(0.95);
}

.btn::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent,
    rgba(255, 255, 255, 0.2),
    transparent
  );
  transform: rotate(45deg);
  transition: 0.5s var(--animation-timing);
  opacity: 0;
}

.btn:hover::after {
  opacity: 1;
  transform: rotate(45deg) translate(50%, 50%);
}

/* Keyframes */
@keyframes bounceIn {
  0% {
    opacity: 0;
    transform: scale(0.7) translateY(-100px);
  }
  50% {
    opacity: 1;
    transform: scale(1.05) translateY(10px);
  }
  70% {
    transform: scale(0.95) translateY(-5px);
  }
  100% {
    transform: scale(1) translateY(0);
  }
}

@keyframes textPopIn {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes containerGlow {
  0%, 100% { box-shadow: 0 0 10px var(--glow-color); }
  50% { box-shadow: 0 0 20px var(--glow-color); }
}

@media (max-width: 480px) {
  .container {
    padding: 25px; /* slightly increased for small screens */
  }
  .btn {
    padding: 15px 30px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>WELCOME TO BLOOD DONATION MANAGEMENT SYSTEM</h1>
  <div class="buttons-container">
    <a href="donate.php" class="btn" id="donate-btn" aria-label="Donate Blood">DONATE BLOOD</a>
    <a href="request.php" class="btn" id="request-btn" aria-label="Request Blood">REQUEST BLOOD</a>
  </div>
</div>

<script>
document.querySelectorAll('.btn').forEach(button => {
  button.addEventListener('click', (e) => {
    // Normal link behavior, no JS animation or override needed
  });
});
</script>
</body>
</html>
